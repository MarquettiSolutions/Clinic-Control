name: Deploy Firebase backend


on:
  push:
    branches:
      - main
    paths:
      - "functions/**"
      - "scripts/sync-platform-directory.cjs"
      - "scripts/prepare-mail-secrets.cjs"
      - "scripts/check-mail-automation.cjs"
      - "firestore.rules"
      - "storage.rules"
      - "firebase.json"
      - ".github/workflows/firebase-deploy.yml"
  workflow_dispatch:


permissions:
  contents: read


concurrency:
  group: firebase-backend
  cancel-in-progress: false


jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5


      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22


      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_B64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_B64 }}
        run: |
          test -n "$FIREBASE_SERVICE_ACCOUNT_B64"
          echo "$FIREBASE_SERVICE_ACCOUNT_B64" | base64 --decode > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Check portal regressions
        run: node tests/portal-regression.cjs && node tests/platform-regression.cjs && node tests/mail-regression.cjs


      - name: Install Functions dependencies
        working-directory: functions
        run: npm ci --omit=dev


      - name: Deploy functions, Firestore rules and Storage rules
        # SMTP credentials remain in Secret Manager, not function source or logs.
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          node scripts/prepare-mail-secrets.cjs
          npx --yes firebase-tools@15.30.0 deploy --project clinic-control-6ff25 --only functions,firestore:rules,storage --non-interactive
          node scripts/check-mail-automation.cjs

      - name: Preview existing clinic directory reconciliation
        run: node scripts/sync-platform-directory.cjs --project=clinic-control-6ff25

      - name: Reconcile existing clinic directory without changing clinical data
        run: node scripts/sync-platform-directory.cjs --project=clinic-control-6ff25 --apply
